name: Deploy docs site

# B5: docs-site/ already lives in this monorepo, so this workflow deploys it
# to this repo's own GitHub Pages using the repo's built-in Actions token —
# no cross-repo credential needed, unlike the old opennoodl-docs arrangement.
# Triggers on `main` only: this publishes to a public URL, and `main` is the
# branch that's supposed to reflect what's actually shipping.

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      # HLT-013: a library entry's README is the source of its docs page.
      - 'library/*/*/README.md'
      - 'packages/noodl-types/src/node-catalog.json'
      - 'docs/node-catalog/enrichment/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy in flight at a time; a newer push should win rather than
# queue behind an older one still building.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Regenerates docs/node-catalog/enrichment's generated pages from the
      # bundled catalog, then the Docusaurus build itself.
      - run: npm run docs-site:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 🔴 HLT-013. The node picker draws a "Read docs" button for every library
  # entry `libraryDocsPages.ts` lists, and opens `getDocsEndpoint() + entry.docs`.
  # This asks the site just deployed for each of those URLs. It runs here, not on
  # the PR, because it grades what is SERVED — on the PR that adds a page the
  # page is not served yet. Pages takes a moment to go live after
  # `deploy-pages` returns, so a first PATH MOVED is retried before it counts.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Every Read docs button answers
        run: |
          for attempt in 1 2 3 4 5; do
            if npm run docs:verify-origin -- --library-docs; then exit 0; fi
            echo "attempt $attempt did not pass; waiting for Pages to settle"
            sleep 60
          done
          exit 1
