name: Nightbook desktop (TPL-011)

# The evening journal (TPL-011) as a Windows app: an Electron shell that runs its own
# nodegx-backend, with no network. Builds the NSIS installer on Windows, installs it
# silently on the runner, drives the INSTALLED app across two restarts plus a
# fresh-home control, and uploads the installer and the drive's report.
#
# Source and rationale: dev-docs/tasks/phase-78-the-templates/nightbook-desktop/ and
# TPL-011-DESKTOP-THE-JOURNAL-ON-WINDOWS.md. Unsigned by ruling D2.

on:
  push:
    branches: [tpl011-desk1]
  workflow_dispatch:

concurrency:
  group: nightbook-desktop
  cancel-in-progress: true

jobs:
  # Authoring does not depend on the platform, and @nodegx/export (which the MCP door imports) does not
  # build on Windows: its build.mjs runs execFileSync('npx', …), and npx is npx.cmd there (ENOENT,
  # measured on windows-latest, run 36250068983). So the spike is authored and gated here, on Linux,
  # and the Windows job takes the generated project.
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build the page kit and author the spike
        run: |
          npm run build --workspace @nodegx/export
          # The door reads a project's kits through the gitignored dist/kit-extract.cjs (P78 D83).
          npm run build --workspace @noodl/mcp
          node library/modules/nightbook-kit/build.mjs
          npx ts-node -T -P ./scripts/tsconfig.json ./scripts/generate-nightbook-spike.ts

      - name: Kit gate
        working-directory: packages/noodl-mcp
        run: npx jest tests/tpl011Kit.test.ts

      - uses: actions/upload-artifact@v4
        with:
          name: spike-app
          path: dev-docs/tasks/phase-78-the-templates/nightbook-desktop/spike-app
          include-hidden-files: true
          retention-days: 7

  windows:
    needs: spike
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: ./.github/actions/setup

      # The production viewer: nodegx-deploy refuses a development engine.
      - name: Build viewer bundles
        run: npm run build:editor:_viewer
        env:
          WORKSPACE_PATH: .

      - name: Build the backend bundle and the deploy engine
        run: |
          npm --prefix packages/nodegx-backend run build
          npm run build --workspace @noodl/preview

      # DESK-1 proved the shell with the todo list; the app inside is now the page-designer spike
      # (TPL-011 §3.6): the kit and its fonts, and one page authored through the MCP door.
      - uses: actions/download-artifact@v4
        with:
          name: spike-app
          path: dev-docs/tasks/phase-78-the-templates/nightbook-desktop/spike-app

      - name: Assemble the app (export + backend + policy)
        run: node dev-docs/tasks/phase-78-the-templates/nightbook-desktop/build-app.js --project dev-docs/tasks/phase-78-the-templates/nightbook-desktop/spike-app

      - name: Relay specs
        working-directory: dev-docs/tasks/phase-78-the-templates/nightbook-desktop/shell
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Build the installer
        working-directory: dev-docs/tasks/phase-78-the-templates/nightbook-desktop/shell
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Install it silently (per-user, no admin)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dev-docs/tasks/phase-78-the-templates/nightbook-desktop/shell/dist/Nightbook-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          Get-Process Nightbook -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\nightbook\Nightbook.exe'
          if (-not (Test-Path $exe)) { Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Filter Nightbook.exe | Select-Object -First 3; throw "Nightbook.exe not at $exe" }
          "NIGHTBOOK_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Drive the installed app (decorate, restart, the page comes back, control)
        run: node dev-docs/tasks/phase-78-the-templates/nightbook-desktop/drive-page-designer.js --exe "$NIGHTBOOK_EXE"
        env:
          NIGHTBOOK_DRIVE_REPORT: ${{ github.workspace }}/drive-report.json

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp dev-docs/tasks/phase-78-the-templates/nightbook-desktop/shell/dist/Nightbook-Setup-*.exe out/ || true
          cp dev-docs/tasks/phase-78-the-templates/nightbook-desktop/shell/build-output/BUILD.json out/ || true
          cp drive-report.json out/ || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightbook-win32-x64-${{ github.sha }}
          path: out
          retention-days: 30
