<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habit Tracker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">
  <header class="app__header">
    <h1>Habit Tracker</h1>
    <p class="app__date" id="today-label"></p>
    <p class="app__summary" id="today-summary"></p>
  </header>

  <form class="add" id="add-form" autocomplete="off" novalidate>
    <label class="sr-only" for="habit-input">Habit name</label>
    <input
      id="habit-input"
      name="habit"
      type="text"
      maxlength="60"
      placeholder="e.g. Read 10 pages"
      aria-describedby="form-error"
      required>
    <button type="submit" class="btn btn--primary">Add habit</button>
  </form>

  <p class="form-error" id="form-error" role="alert" hidden></p>
  <p class="storage-warning" id="storage-warning" role="alert" hidden></p>

  <section aria-labelledby="list-heading">
    <h2 class="sr-only" id="list-heading">Your habits</h2>
    <ul class="habits" id="habit-list"></ul>
    <p class="empty" id="empty-state" hidden>
      No habits yet. Add your first one above, then tick it off each day.
    </p>
  </section>
</main>

<template id="habit-template">
  <li class="habit" data-id="">
    <div class="habit__row">
      <button type="button" class="check" data-action="toggle-today" aria-pressed="false">
        <span class="check__mark" aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.5 8.5l3 3 6-7"></path>
          </svg>
        </span>
        <span class="check__text">Mark done</span>
      </button>

      <div class="habit__text">
        <h3 class="habit__name"></h3>
        <p class="habit__meta"><span class="streak"></span></p>
      </div>

      <button type="button" class="btn btn--danger" data-action="delete">Delete</button>
    </div>

    <ol class="week" data-role="week"></ol>
  </li>
</template>

<script src="app.js"></script>
</body>
</html>
