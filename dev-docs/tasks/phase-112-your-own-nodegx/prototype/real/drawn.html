<!doctype html>
<!--
  P112 OWN-012 — a project's first page drawn from the descriptions, beside the real app, and graded node by node.

  Left: the real app (NodeGX's own runtime through @nodegx/preview, the frame the size of the viewport asked for).
  Right: the same screen drawn on a 2D canvas from the files, the node specs and the layout model — the drawer in
  `@nodegx/node-spec` (src/draw.ts, its drawer-only entry bundled as drawn.js by own-012/build.sh) with the values the
  real app's trace says its wires carry. No CSS is read for the drawing; the real app's elements are read only to grade it.

  Step 1 (s1) drew Orbit's one component. Step 2 draws any project folder beside serve.mjs: every component by path, a
  placed component's roots standing in its place, a Router showing the page the real app shows, design tokens from the
  project file and the default token table (not from the page's CSS).

  window.__own012 = { ready, project, viewport, stilled, status, rows: [{ path, id, type, drawn, real, dx, dy, dw, dh,
                      within, verdict, outside, needs, limits }], needs, values, visualCount, pageErrors }

  node serve.mjs → /drawn.html?project=<folder>&w=390&h=844 [&pause=<node id>] [&still=0] [&variant=row] [&mutant=nogap]
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drawn From Specs</title>
<style>
  :root { --bg: #f4f5f7; --fg: #1c2128; --muted: #5b6573; --line: #d5d9df; --ok: #1a7f37; --bad: #c62828; --named: #8a6d00; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #14171b; --fg: #e7eaee; --muted: #9aa4b1; --line: #2c323a; --ok: #4ac26b; --bad: #ff6b6b; --named: #e3c05a; } }
  :root[data-theme="dark"] { --bg: #14171b; --fg: #e7eaee; --muted: #9aa4b1; --line: #2c323a; --ok: #4ac26b; --bad: #ff6b6b; --named: #e3c05a; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  main { display: flex; gap: 24px; padding: 16px; flex-wrap: wrap; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { color: var(--muted); margin-bottom: 6px; }
  #app, #drawn { border: 1px solid var(--line); background: #000; display: block; }
  table { border-collapse: collapse; font: 12px/1.3 ui-monospace, monospace; }
  td, th { border-bottom: 1px solid var(--line); padding: 3px 8px; text-align: left; vertical-align: top; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .named { color: var(--named); }
  #needs li { margin-bottom: 4px; }
</style>
</head>
<body>
<main>
  <figure><figcaption>The real app</figcaption><div id="app"></div></figure>
  <figure><figcaption>Drawn from the specs and the layout model</figcaption><canvas id="drawn"></canvas></figure>
  <section>
    <table id="grade"><thead><tr><th>node</th><th>drawn</th><th>real</th><th>Δ</th><th>verdict</th></tr></thead><tbody></tbody></table>
    <h3>What the drawing needed that no spec gave</h3>
    <ul id="needs"></ul>
  </section>
</main>
<script src="preview.js"></script>
<script type="module">
import { draw, traceValue, isVisualType, canvasTextMeasurer, DEFAULT_TOKENS } from './drawn.js';

const q = new URLSearchParams(location.search);
const viewport = { width: Number(q.get('w') || 390), height: Number(q.get('h') || 844) };
const projectName = q.get('project') || 'orbit';
const TOL = 2;
window.__own012 = { ready: false, project: projectName, viewport };

const files = await (await fetch(`/project/${projectName}.json`)).json();
// ?variant=row — the FLD-004 trap, in memory for both sides: Orbit's track stacks across, so the bar's wired width is a share
// of a row, not a percent (OWN-004 §6.2). ?mutant=nogap — the drawer alone loses every gap: the grade must go red.
const variant = q.get('variant');
const mutant = q.get('mutant');
if (variant === 'row') {
  for (const k of Object.keys(files).filter((k) => k.endsWith('/nodes.json'))) {
    const doc = JSON.parse(files[k]);
    for (const n of doc.nodes) if (n.id === 'track') n.parameters = { ...n.parameters, flexDirection: 'row' };
    files[k] = JSON.stringify(doc);
  }
}
const project = JSON.parse(files['nodegx.project.json']);
// every component by path: components/<path>/nodes.json → '/<path>'
const components = {};
for (const k of Object.keys(files).filter((k) => k.startsWith('components/') && k.endsWith('/nodes.json'))) {
  components['/' + k.slice('components/'.length, -'/nodes.json'.length)] = JSON.parse(files[k]);
}
// the root component: the one the project's rootNodeId lives in, else /App, else the first
const rootPath = Object.keys(components).find((p) => components[p].nodes.some((n) => n.id === project.rootNodeId)) || (components['/App'] ? '/App' : Object.keys(components)[0]);
const rootComp = components[rootPath];

// design tokens: the project's own over the default table — the files, not the page's CSS
const tokens = new Map(DEFAULT_TOKENS.map((t) => [t.name, t.value]));
for (const t of project.metadata?.designTokens?.customTokens ?? []) tokens.set(t.name, t.value);
const tokenValue = (name) => tokens.get(name);
// the layout model takes px only: a `px` token is one, a unitless or any other unit is "no value here" (reported by layoutOf)
const tokenPx = (name) => { const v = tokens.get(name); const m = typeof v === 'string' && /^(-?\d*\.?\d+)\s*px$/.exec(v.trim()); return m ? Number(m[1]) : undefined; };

const box = document.getElementById('app');
box.style.width = viewport.width + 'px';
box.style.height = viewport.height + 'px';
const preview = await NodegxPreview.mountPreview(box, { runtimeBase: '/runtime/' });
const last = {};
preview.onTrace(({ events }) => {
  for (const e of events) if (e.kind === 'value') (last[e.toNode] ??= {})[e.toPort] = traceValue(e.value);
});
const status = await preview.update(files);
if (status.status !== 'ok') throw new Error('the app did not run: ' + (status.message || status.status));
if (preview.frame) { preview.frame.style.width = viewport.width + 'px'; preview.frame.style.height = viewport.height + 'px'; preview.frame.style.border = '0'; }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
await sleep(1500);
// A still screen to grade (OWN-012 §6 s1): a drawing from the last trace value and a box read now can be one read apart.
// `?pause=<id>` presses that node's button first (Orbit's own Pause); then the page waits until the trace has not changed
// across 600 ms, up to 6 s. `?still=0` grades a moving screen.
let stilled = false;
if (q.get('still') !== '0') {
  const pauseId = q.get('pause') ?? (projectName === 'orbit' ? 'pauseBtn' : '');
  const pause = pauseId ? preview.elementsOf(pauseId)[0] : undefined;
  const btn = pause && (pause.matches('button') ? pause : pause.querySelector('button'));
  if (btn) { btn.click(); await sleep(1500); }
  for (let i = 0; i < 10 && !stilled; i++) {
    const frozen = JSON.stringify(last);
    await sleep(600);
    stilled = JSON.stringify(last) === frozen;
  }
}

// ---- the real app's elements by path, and which page each Router shows — read to grade, never to draw.
// The runtime's scopes: a placed component is a node whose own scope holds the component's nodes; a Router makes the page
// component's instance in its own scope under a generated id, so that instance is put under the Router's id, as the
// drawer puts it (draw.ts header 4–5).
function realElements() {
  const map = new Map();
  const pages = new Map();
  const rt = preview.frame?.contentWindow?.Noodl?.Navigation?._noodlRuntime;
  const root = rt?.context?.rootComponent;
  if (!root) return { map, pages };
  const walk = (scope, prefix, comp) => {
    const nodes = Object.values(scope.nodes || {});
    const fileIds = comp ? new Set(comp.nodes.map((n) => n.id)) : undefined;
    const routers = nodes.filter((n) => (n.model?.type || n.name) === 'Router');
    for (const r of routers) if (r._internal?.currentPage?.component) pages.set(prefix ? prefix + '/' + r.id : r.id, r._internal.currentPage.component);
    for (const n of nodes) {
      const isInstance = !!(n.nodeScope && n.nodeScope !== scope && n.nodeScope.nodes);
      let path = prefix ? prefix + '/' + n.id : n.id;
      let placed = isInstance ? components[n.name] : undefined;
      if (isInstance && fileIds && !fileIds.has(n.id)) {
        const r = routers.find((x) => x._internal?.currentPage?.component === n.name) || routers.find((x) => x._internal?.currentPage);
        if (r) { path = prefix ? prefix + '/' + r.id : r.id; placed = components[r._internal.currentPage.component]; }
      }
      if (isInstance) { walk(n.nodeScope, path, placed); continue; }
      const el = typeof n.getDOMElement === 'function' ? n.getDOMElement() : null;
      if (el && !map.has(path)) map.set(path, el);
    }
  };
  walk(root.nodeScope, '', rootComp);
  return { map, pages };
}
const real = realElements();

// ---- the one thing the model does not do: a leaf's content. A canvas measures text from what the spec's ports say.
const ctx2 = document.createElement('canvas').getContext('2d');
const measure = canvasTextMeasurer({ context: ctx2, token: tokenValue });

const values = JSON.parse(JSON.stringify(last));
const drawComponents = mutant === 'nogap'
  ? Object.fromEntries(Object.entries(components).map(([p, c]) => [p, { ...c, nodes: c.nodes.map((n) => { const prm = { ...n.parameters }; delete prm.rowGap; delete prm.columnGap; return { ...n, parameters: prm }; }) }]))
  : components;
const drawing = draw({
  nodes: drawComponents[rootPath],
  components: drawComponents,
  values,
  viewport,
  measure,
  token: tokenPx,
  pageOf: (node, path) => real.pages.get(path),
  bodyScroll: project.settings?.bodyScroll === true
});

// ---- the grade: the same instant, the real app's boxes read once. A box is matched by its path; a node the walk did not
// reach falls back to `preview.elementsOf(id)` when that names exactly one element.
const elementFor = (b) => {
  const byPath = real.map.get(b.path);
  if (byPath) return byPath;
  const els = preview.elementsOf(b.id);
  return els.length === 1 ? els[0] : undefined;
};
// A need that is an assumption the drawer or the measurer made in the open (not a note on how it measured) names a difference.
const isAssumption = (w) => /assumed|no spec|not among|one row per item|no size or axis role|lists no page|browser's own|browser draws/.test(w);
const rows = drawing.boxes.map((b) => {
  const el = elementFor(b);
  const r = el?.getBoundingClientRect();
  const real = r ? { x: r.x, y: r.y, width: r.width, height: r.height } : null;
  const d = real && b.present ? { dx: b.x - real.x, dy: b.y - real.y, dw: b.width - real.width, dh: b.height - real.height } : {};
  const sizeOk = !!real && b.present && Math.abs(d.dw) <= TOL && Math.abs(d.dh) <= TOL;
  const posOk = !!real && b.present && Math.abs(d.dx) <= TOL && Math.abs(d.dy) <= TOL;
  const within = b.present ? sizeOk && posOk : !real;
  const own = [...b.outside, ...b.limits, ...b.needs.filter(isAssumption)];
  return { path: b.path, id: b.id, type: b.type, label: b.label, parent: b.parent, drawn: { x: b.x, y: b.y, width: b.width, height: b.height }, real, ...d, within, sizeOk, posOk, own, present: b.present, outside: b.outside, needs: b.needs, limits: b.limits };
});
// The verdict follows the cause, size and position each: a box is `within 2 px`. A size that is off is named by the
// node's own setting (a limit, an assumption), or `holds` a descendant that is not within (a hugging parent is its
// children). A position that is off `follows` its parent when the parent moved, or an earlier sibling that is not within (a
// stack places what came before), or its own size when that is off and the box is aligned from its end or centre; else the
// node's own setting (`position is fixed`). A difference with none of these is OFF — a defect to file, once, at its source.
const rowAt = (p) => rows.find((x) => x.path === p);
const ancestors = (row) => { const out = []; for (let p = row.parent; p; p = rowAt(p)?.parent) out.push(p); return out; };
const before = (row) => { const i = rows.indexOf(row); return rows.slice(0, i).filter((r) => r.parent === row.parent && r.present).map((r) => r.path); };
const under = (row) => rows.filter((r) => r !== row && r.present && ancestors(r).includes(row.path)).map((r) => r.path);
const notWithin = (paths) => paths.filter((p) => { const r = rowAt(p); return r && !r.within; });
for (const row of rows) {
  if (row.within) { row.verdict = row.present ? 'within 2 px' : 'absent on both'; continue; }
  if (!row.present || !row.real) { row.verdict = row.own.length ? 'named: ' + row.own.join('; ') : 'OFF'; continue; }
  const parts = [];
  let explained = true;
  if (!row.sizeOk) {
    const inside = notWithin(under(row));
    if (row.own.length) parts.push(row.own.join('; '));
    else if (inside.length) parts.push(`holds ${inside.join(', ')}`);
    else explained = false;
  }
  if (!row.posOk) {
    const parent = rowAt(row.parent);
    const moved = parent && !parent.posOk ? [parent.path] : [];
    const earlier = notWithin(before(row));
    if (moved.length || earlier.length) parts.push(`follows ${[...moved, ...earlier].join(', ')}`);
    else if (!row.sizeOk && explained) parts.push('placed by its own size');
    else if (row.own.length && row.sizeOk) parts.push(row.own.join('; '));
    else explained = false;
  }
  row.verdict = explained ? 'named: ' + parts.join('; ') : 'OFF' + (parts.length ? ' (' + parts.join('; ') + ')' : '');
}

// ---- the drawing: boxes and text, in the node's own colours where it names them (look is drawn roughly, not graded)
const nodeAt = (path) => {
  const ids = path.split('/');
  let comp = rootComp;
  let node;
  for (const id of ids) {
    node = comp?.nodes.find((n) => n.id === id);
    if (!node) return undefined;
    if (components[node.type]) comp = components[node.type];
    else if (node.type === 'Router') { const pg = real.pages.get(ids.slice(0, ids.indexOf(id) + 1).join('/')) ?? node.parameters?.pages?.startPage; comp = components[pg]; }
  }
  return node;
};
const cv = document.getElementById('drawn');
cv.width = viewport.width * devicePixelRatio; cv.height = viewport.height * devicePixelRatio;
cv.style.width = viewport.width + 'px'; cv.style.height = viewport.height + 'px';
const g = cv.getContext('2d');
g.scale(devicePixelRatio, devicePixelRatio);
const colour = (v) => { const m = typeof v === 'string' && /^var\(\s*(--[\w-]+)/.exec(v); return m ? tokenValue(m[1]) : v; };
const pxOf = (v) => { const r = typeof v === 'string' && /^var\(\s*(--[\w-]+)/.exec(v) ? tokenValue(RegExp.$1) : v; if (r && typeof r === 'object' && 'value' in r) return Number(r.value); if (typeof r === 'number') return r; if (typeof r === 'string' && /^\d/.test(r)) return parseFloat(r); return undefined; };
for (const b of drawing.boxes) {
  if (!b.present) continue;
  const n = nodeAt(b.path);
  if (!n) continue;
  const read = (p) => values[b.path]?.[p] ?? values[n.id]?.[p] ?? n.parameters?.[p];
  const bg = colour(read('backgroundColor'));
  if (bg && bg !== 'transparent') { g.fillStyle = bg; g.fillRect(b.x, b.y, b.width, b.height); }
  if (n.type === 'Text' || n.type === 'net.noodl.controls.button') {
    const t = String(read(n.type === 'Text' ? 'text' : 'label') ?? '');
    const tt = read('textTransform');
    g.fillStyle = colour(read('color')) || '#888';
    const size = pxOf(read('fontSize')) ?? 16;
    const w = colour(read('fontWeight'));
    g.font = `${w && w !== 'Auto' ? w : 400} ${size}px ${colour(read('fontFamily')) || 'system-ui'}`;
    g.letterSpacing = (pxOf(read('letterSpacing')) ?? 0) + 'px';
    g.textBaseline = 'middle';
    g.textAlign = n.type === 'Text' ? 'left' : 'center';
    g.save(); g.beginPath(); g.rect(b.x, b.y, Math.max(b.width, 1), Math.max(b.height, 1)); g.clip();
    g.fillText(tt === 'uppercase' ? t.toUpperCase() : t, n.type === 'Text' ? b.x : b.x + b.width / 2, b.y + b.height / 2);
    g.restore();
  }
  g.strokeStyle = 'rgba(92,169,255,0.55)';
  g.lineWidth = 1;
  g.strokeRect(b.x + 0.5, b.y + 0.5, b.width - 1, b.height - 1);
}

// ---- the table
const f = (n) => (n === undefined ? '' : Math.round(n * 10) / 10);
const fr = (r) => (r ? `${f(r.x)},${f(r.y)} ${f(r.width)}×${f(r.height)}` : 'no element');
document.querySelector('#grade tbody').innerHTML = rows
  .map((r) => `<tr><td>${r.path}</td><td>${r.present ? fr(r.drawn) : 'not mounted'}</td><td>${fr(r.real)}</td><td class="${r.within ? 'ok' : r.verdict.startsWith('named') ? 'named' : 'bad'}">${r.real && r.present ? `${f(r.dx)},${f(r.dy)} ${f(r.dw)}×${f(r.dh)}` : '—'}</td><td>${r.verdict}</td></tr>`)
  .join('');
const needs = [...new Set(rows.flatMap((r) => [...r.needs, ...r.limits.map((w) => 'LIMIT ' + w)].map((w) => `${r.path}: ${w}`)))];
document.getElementById('needs').innerHTML = [...drawing.needs, ...needs].map((w) => `<li>${w}</li>`).join('');
const visualCount = Object.values(components).reduce((n, c) => n + c.nodes.filter((x) => isVisualType(x.type)).length, 0);
Object.assign(window.__own012, { ready: true, variant, mutant, stilled, status, rootPath, pages: Object.fromEntries(real.pages), rows, needs: [...drawing.needs, ...needs], values, visualCount });
</script>
</body>
</html>
