<!--
  P117 — Tchac-Boum: a chain-reaction machine on a wall, which is a NodeGX graph seen from the front.

  The project is v2 files held in memory (`tchac/`, served as one map by serve.mjs). Every edit on this page — a part
  moved, a part taken from the shelf, a string dragged between two parts, a dial turned, a part removed, a mission's
  step — is a write through `V2ProjectStore` (P112 OWN-001), and the app is the files running on NodeGX's own runtime
  (`@noodl/preview`'s in-page build, P112 OWN-004). Nothing here runs a node: the marbles on the strings and the faces
  on the parts are the running app's own trace, and a mission's Vérifier plays the graph on a COPY of the files in a
  second real app.

  Two faces, one gesture: Mur (the machine on a brick wall, in three dimensions: a low-poly costume on a plank for every
  part, rails between them, marbles that roll, a balloon that pops into shards — mur3d.js) and Circuit (the editor's
  canvas look, the node's type and ports). Flip the wall and every part turns over in place: the same node, the same
  wire, the same files. The part's element is pinned onto its plank (CSS3D), so the DOM the gate clicks is unchanged.

    node serve.mjs → /tchac-boum.html   ?face=mur|circuit  ?demo (plays the three missions by itself)  ?set=node.param=value
-->

<script type="module">
import { look, nodeScheme, wireColors } from './look.js';
import { portsFor } from './specs.js';
import { createWall } from './mur3d.js';

const $ = (id) => document.getElementById(id);
const say = (t) => { document.title = t; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = (ms) => new Promise((r) => setTimeout(r, reduce ? Math.min(ms, 80) : ms));
const query = new URLSearchParams(location.search);
const RUNTIME = new URL('runtime/', location.href).href;
const W = 220, H = 150;
try {

/* ================= the project, held in memory; every edit is a write through the store ================= */
const source = await (await fetch(`project/${query.get('project') || 'tchac'}.json`)).json();
const files = NodegxPreview.memoryFiles(source);
const store = new NodegxPreview.V2ProjectStore(files);
const KEY = store.componentKeys().includes('App') ? 'App' : store.componentKeys()[0];
function write(mutate) {
  const c = store.readComponent(KEY);
  mutate(c.files.nodes.nodes, c.files.connections.connections, c.files.nodes);
  store.writeComponent(KEY, c.files, { ifRevision: c.revision });
}
const writeParam = (node, param, value) => write((ns) => {
  const n = ns.find((x) => x.id === node);
  if (value === undefined) { if (n.parameters) delete n.parameters[param]; }
  else n.parameters = { ...(n.parameters ?? {}), [param]: value };
});
for (const s of query.getAll('set')) {
  const [, node, param, raw] = s.match(/^([^.]+)\.([^=]+)=(.*)$/);
  writeParam(node, param, isNaN(Number(raw)) ? raw : Number(raw));
}

/* ================= the real app ================= */
const preview = await NodegxPreview.mountPreview($('app'), { runtimeBase: RUNTIME });
const first = await preview.update(files.entries());
if (first.status !== 'ok') setTimeout(() => toast(`L'appli ne s'affiche pas : ${first.message || first.status}`), 0);
const library = preview.nodeLibrary || { nodetypes: [] };
const libIndex = new Map((library.nodetypes || []).map((t) => [t.name, t]));

/* ================= the graph, read from the files ================= */
let nodes, conns, byId, visual, parentOf;
const wireKey = (c) => `${c.fromId}.${c.fromProperty}>${c.toId}.${c.toProperty}`;
function readGraph() {
  const comp = store.readComponent(KEY).files;
  nodes = comp.nodes.nodes;
  conns = comp.connections.connections;
  byId = Object.fromEntries(nodes.map((n) => [n.id, n]));
  visual = new Set(); parentOf = {};
  const walk = (id, parent) => { if (!byId[id] || visual.has(id)) return; visual.add(id); if (parent) parentOf[id] = parent; for (const c of byId[id].children || []) walk(c, id); };
  for (const r of comp.nodes.visualRoots || []) walk(r, null);
}
readGraph();
/** The parts on the wall: every node but a Group (a box that holds screen parts is the board itself, not a part). */
const shown = () => nodes.filter((n) => n.type !== 'Group').map((n) => n.id);

/* ================= ports: the spec's where the type has one, else the runtime's library; French nicknames on top ================= */
const tname = (t) => (typeof t === 'object' && t !== null ? t.name : t) ?? '*';
const typeName = (type) => libIndex.get(type)?.displayNodeName || libIndex.get(type)?.displayName || ({ 'net.noodl.controls.button': 'Button' })[type] || type;
const labelOf = (id) => byId[id]?.label || typeName(byId[id]?.type);
const libPorts = (type, plug) => (libIndex.get(type)?.ports || []).filter((p) => p.plug === plug || p.plug === 'input/output').map((p) => ({
  name: p.name, label: p.displayName || p.name, type: tname(p.type), signal: tname(p.type) === 'signal', default: p.default,
  enums: Array.isArray(p.type?.enums) ? p.type.enums.map((e) => (typeof e === 'object' ? e.value : e)) : undefined, group: p.group
}));
// what a part's connectors are called on the wall; anything not here keeps the spec's own name
const FR = {
  'Counter': { increase: 'une bille entre (+1)', decrease: 'une bille sort (−1)', reset: 'remettre à zéro', currentCount: 'le compte', countChanged: 'ça vient de compter', startValue: 'compte de départ', limitsEnabled: 'avec limites', limitsMin: 'minimum', limitsMax: 'maximum' },
  'Timer': { start: 'lâcher la bille', restart: 'relâcher', stop: 'stop', duration: 'durée de la descente (ms)', startDelay: 'attente avant (ms)', timerFinished: 'arrivée en bas', timerStarted: 'départ' },
  'Switch': { on: 'allumer', off: 'éteindre', flip: 'basculer', state: 'allumé ?', switched: 'a changé', switchedToOn: "vient de s'allumer", switchedToOff: "vient de s'éteindre", onFromStart: 'allumé au départ' },
  'Expression': { expression: 'la formule', result: 'le résultat', isTrue: 'vrai ?', isFalse: 'faux ?', isTrueEv: 'si vrai →', isFalseEv: 'si faux →', run: 'calculer', evaluateAtLoad: 'calculer au départ', asString: 'en texte', asNumber: 'en nombre', asBoolean: 'en vrai/faux', error: 'erreur' },
  'Repeat': { interval: 'toutes les (ms)', start: 'démarrer', stop: 'stop', tick: 'tic !', count: 'nombre de tics' },
  'Boolean To String': { input: 'vrai ou faux ?', trueString: 'si vrai, écrire', falseString: 'si faux, écrire', currentValue: 'le texte', inputChanged: 'a changé' },
  'String Format': { format: 'le modèle', formatted: 'le texte' },
  'Condition': { condition: 'vrai ou faux ?', eval: 'décider', ontrue: 'si vrai →', onfalse: 'si faux →', result: 'vrai ?', isfalse: 'faux ?' },
  'Inverter': { value: 'entrée', result: 'le contraire' },
  'net.noodl.controls.button': { onClick: 'clic !', label: "l'étiquette" },
  'Text': { text: 'le texte' }
};
const fr = (type, name, fallback) => FR[type]?.[name] ?? fallback;

function openConpop(a, b, x, y) {

  s.busy = true;
  setFace('mur');
  showTab('missions');
  for (let j = 0; j < m.steps.length; j++) {
    s.step = j; drawMissions();
    await sleep(500);
    await m.steps[j].run();
    toast(m.steps[j].say);
    await sleep(700);
  }
  s.step = m.steps.length; drawMissions();
  await sleep(300);
  s.step = -1; s.busy = false;
  return runCheck(i);
}

/* ================= the two faces ================= */
const CAPTIONS = {
  mur: ['Le mur : une machine à réaction en chaîne.', "Appuie sur le gros bouton de l'appli (ou sur son costume ici) : une bille entre dans le tourniquet, descend la rampe, et le ballon éclate. Chaque pièce est une vraie pièce de NodeGX ; chaque ficelle, un vrai fil. Retourne le mur pour voir."],
  circuit: ['Le circuit : la même machine, vue de derrière.', "Chaque pièce s'est retournée sur place : c'est le même nœud, avec son vrai nom et ses vraies prises, et les mêmes fils. Les billes sont des signaux ; les ficelles en pointillé portent des valeurs. Ce sont les mêmes fichiers — l'éditeur officiel les ouvre tels quels."]
};
let face = query.get('face') === 'circuit' ? 'circuit' : 'mur';
function setFace(f) {
  face = f;
  document.body.classList.toggle('circuit', f === 'circuit');
  wall.setFace(f); syncWires();
  for (const b of document.querySelectorAll('[data-face]')) b.setAttribute('aria-pressed', String(b.dataset.face === f));
  $('capH').textContent = CAPTIONS[f][0]; $('capS').textContent = CAPTIONS[f][1];
  const q = new URLSearchParams(location.search); q.set('face', f); history.replaceState(null, '', '?' + q);
}
for (const b of document.querySelectorAll('[data-face]')) b.onclick = () => setFace(b.dataset.face);
$('reset').onclick = () => location.reload();
$('projName').textContent = JSON.parse(files.read('nodegx.project.json') || '{}').name || '';

/* ================= go ================= */
for (const id of shown()) makePart(id);
syncWires();
drawMissions();
drawPanel();
setFace(face);
fit();
addEventListener('resize', () => { wall.resize(); fit(); });

window.__tchac = {
  recent, wiresSeen, preview, store, files, parts, last, MISSIONS, mstate, portsOf, connect, disconnect, addNode, removeNode, setParam, select, setFace, fit, runCheck, showMe, pressInApp, wall,
  get conns() { return conns; }, get nodes() { return nodes; }, get face() { return face; }, get events() { return eventCount; }, get lastShow() { return lastShow; }, get shows() { return shows; }, get selected() { return selected; }, get live() { return wall.beads; }, get checker() { return checker; }, get pending() { return pending; }
};
if (query.has('demo')) (async () => {
  await sleep(1500);
  pressInApp('btn'); await sleep(1800);
  for (let i = 0; i < 3; i++) { await showMe(i); await sleep(1400); }
  setFace('circuit');
})();
say(`ready nodes=${nodes.length} wires=${conns.length} parts=${Object.keys(parts).length} export=${Math.round(first.exportMs)}ms frame=${Math.round(first.frameMs)}ms`);
} catch (e) { say('FAIL ' + (e && e.stack || e)); console.error(e); $('err').hidden = false; $('err').textContent = String(e && e.stack || e); }
</script>
