name = "hst-spike-worker"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
# global_fetch_strictly_public: the API step may call another Worker on the same account (the stand-in); without it,
# Cloudflare refuses a Worker-to-Worker fetch with error 1042.
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# The project's schedule triggers, as Worker crons. A real target writes this list from nodegx.automations.json.
[triggers]
crons = ["0 8 * * *"]


# The front end: the HTML export, served by the same Worker (one origin, one deploy). The Worker runs first only for its doors.
[assets]
directory = "./public"
run_worker_first = ["/workflows/*", "/functions/*", "/__nodegx/*"]

# Every run's console line kept in the dashboard (Workers & Pages → hst-spike-worker → Logs).
[observability]
enabled = true

# HST-004 §10: one note a day per refusal code, so a builder gets one email a day however many refusals are reported.
[[kv_namespaces]]
binding = "NODEGX_ALERTS"
id = "31507653de7f45a09d54bfb44d116cd4"

# HST-004 §10: who hears about a refusal. Route 1 (Cloudflare's own sending) needs a domain onboarded to Cloudflare:
#   [[send_email]]
#   name = "ALERT_EMAIL"
#   and ALERT_FROM = "alerts@<that domain>" below. Route 2 needs `wrangler secret put RESEND_API_KEY`.
[vars]
ALERT_TO = ""  # the builder's address: set it here before deploying, never commit it (this repo is public)
