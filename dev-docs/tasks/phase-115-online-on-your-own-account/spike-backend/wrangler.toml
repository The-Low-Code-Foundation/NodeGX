name = "hst-backend-spike"
main = "dist/worker.mjs"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
# HST-006 §7: build.mjs bundles (an html-as-text loader and the node:sqlite swap wrangler cannot do); upload as built.
no_bundle = true

[build]
command = "node build.mjs"

# The whole built-in backend service (BackendService, unchanged) inside ONE SQLite-backed Durable Object.
# `node:sqlite` is answered by the object's own database (src/nodeSqliteShim.ts); the record adapter's engine is the
# same database through spike-records' doEngine (transactionSync for db.transaction).
[[durable_objects.bindings]]
name = "BACKEND"
class_name = "Backend"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Backend"]

[observability]
enabled = true
