<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Bubble</title>
<!--
  P123 Open Bubble — a Bubble-shaped editor for a NodeGX app, built from the kit (P112's "your own editor").

  Three tabs, as Bubble has them:
    Design    the real app in the page (`@nodegx/preview`), an element palette and tree on the left, a property
              editor on the right; click an element in the page to select it, drag it to another place in its
              layout, pull a handle to resize it
    Workflow  "When <element> <event>" → numbered action steps, read from the wires; add a step, delete a step
    Data      the app's data types and fields (the project file's `dbCollections`), and the rows on the bound backend

  Every change is an edit through the kit's own store (`V2ProjectStore`, the same eight edits the editor suite
  grades: add_node, remove_node, connect, disconnect, set_parameter, move, rename, add_child), saved to the project
  folder by serve.mjs, and the app rebuilt from the files. Nothing here draws the app or runs a node.
-->
<style>
  :root {
    --bg: #f3f4f6; --panel: #ffffff; --line: #e2e5ea; --ink: #1b1f27; --muted: #6b7280; --accent: #2457f5;
    --accent-soft: #e8eefe; --hover: #22c55e; --sel: #2457f5; --danger: #dc2626; --radius: 6px;
    font-family: -apple-system, "Segoe UI", Inter, system-ui, sans-serif; font-size: 13px; color: var(--ink);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 4px 10px; }
  button:hover { border-color: #c8cdd5; background: #fafbfc; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { background: #1d49d6; }
  button.danger { color: var(--danger); }
  button.tiny { padding: 1px 6px; font-size: 11px; }
  input[type=text], input[type=number], select, textarea { border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 6px; background: #fff; width: 100%; min-width: 0; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  header { height: 46px; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: #1b1f27; color: #fff; }
  header .brand { font-weight: 700; letter-spacing: .2px; }
  header .brand span { color: #8fb0ff; }
  header .project { color: #c7cbd3; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header nav { display: flex; gap: 2px; margin-left: 10px; }
  header nav button { background: transparent; border: 0; color: #c7cbd3; padding: 6px 12px; border-radius: 4px; }
  header nav button[aria-selected=true] { background: #2e3440; color: #fff; }
  header .spacer { flex: 1; }
  header .status { color: #aab0bb; font-size: 12px; max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .status.bad { color: #ffb4b4; }
  header select, header > button { width: auto; background: #2e3440; color: #fff; border-color: #3b4252; }
  header > button:hover { background: #3b4252; }
  header label { display: flex; align-items: center; gap: 6px; color: #c7cbd3; }
  main { height: calc(100% - 46px); }
  section.tab { height: 100%; display: grid; }
  section[hidden] { display: none; }

  /* ---- Design ---- */
  #design { grid-template-columns: 250px 1fr 320px; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; display: flex; flex-direction: column; }
  aside.right { border-right: 0; border-left: 1px solid var(--line); }
  aside h3 { margin: 0; padding: 10px 12px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .palette { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 12px 12px; }
  .palette button { text-align: left; padding: 7px 8px; display: flex; gap: 8px; align-items: center; }
  .palette button i { width: 20px; height: 20px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); display: inline-grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 700; }
  .palette button[aria-pressed=true] { border-color: var(--accent); background: var(--accent-soft); }
  .tree { padding: 0 6px 12px; flex: 1; }
  .tree div.row { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 4px; cursor: default; white-space: nowrap; }
  .tree div.row:hover { background: #f4f6fa; }
  .tree div.row[aria-selected=true] { background: var(--accent-soft); color: var(--accent); }
  .tree div.row .t { color: var(--muted); font-size: 11px; }
  #stage { position: relative; overflow: auto; background: #e9ebef; display: flex; justify-content: center; align-items: flex-start; padding: 24px; flex-wrap: wrap; gap: 14px; }
  #problems { width: 100%; max-width: 960px; background: #fff7ed; border: 1px solid #fdba74; border-left: 4px solid #ea580c; border-radius: var(--radius); padding: 10px 14px; }
  #problems h4 { margin: 0 0 6px; font-size: 13px; }
  #problems li { margin: 4px 0; }
  #problems li small { color: var(--muted); display: block; }
  #appwrap { position: relative; height: calc(100vh - 46px - 48px); min-height: 500px; background: #fff; box-shadow: 0 2px 16px rgba(0,0,0,.12); flex: 0 0 auto; }
  #app { position: absolute; inset: 0; }
  #overlay { position: absolute; inset: 0; z-index: 10; cursor: default; }
  #overlay.preview { pointer-events: none; }
  #overlay.adding { cursor: crosshair; }
  .box { position: absolute; pointer-events: none; border: 1px solid var(--hover); }
  .box.sel { border: 2px solid var(--sel); pointer-events: none; }
  .box .tag { position: absolute; left: -2px; top: -20px; background: var(--sel); color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 3px 3px 0 0; white-space: nowrap; }
  .box.hov .tag { background: var(--hover); }
  .handle { position: absolute; width: 9px; height: 9px; background: #fff; border: 2px solid var(--sel); border-radius: 2px; pointer-events: auto; }
  .handle.e { right: -6px; top: calc(50% - 5px); cursor: ew-resize; }
  .handle.s { bottom: -6px; left: calc(50% - 5px); cursor: ns-resize; }
  .handle.se { right: -6px; bottom: -6px; cursor: nwse-resize; }
  .drop { position: absolute; background: var(--accent); pointer-events: none; }
  .drop.into { background: transparent; border: 2px dashed var(--accent); }
  .props { padding: 0 12px 20px; }
  .props .head { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .props .head input { font-weight: 600; }
  .props .head .type { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .group { border-bottom: 1px solid var(--line); }
  .group summary { padding: 8px 0; font-weight: 600; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
  .group summary::after { content: '▾'; color: var(--muted); }
  .group:not([open]) summary::after { content: '▸'; }
  .field { display: grid; grid-template-columns: 110px 1fr; gap: 6px; align-items: center; padding: 3px 0; }
  .field label { color: #3b4252; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .field .unit { display: grid; grid-template-columns: 1fr 56px; gap: 4px; }
  .field .color { display: grid; grid-template-columns: 1fr 28px; gap: 4px; align-items: center; }
  .field .swatch { width: 24px; height: 24px; border-radius: 4px; border: 1px solid var(--line); }
  .field.wired input, .field.wired select { background: #f3f8ff; }
  .field .from { font-size: 11px; color: var(--accent); grid-column: 2; }
  .hint { color: var(--muted); padding: 8px 12px; font-size: 12px; }
  .empty { color: var(--muted); padding: 18px; }

  /* ---- Workflow ---- */
  #workflow { grid-template-columns: 300px 1fr; }
  .events { padding: 0 6px 12px; }
  .events div.row { padding: 7px 8px; border-radius: 4px; cursor: default; }
  .events div.row:hover { background: #f4f6fa; }
  .events div.row[aria-selected=true] { background: var(--accent-soft); color: var(--accent); }
  .events div.row small { display: block; color: var(--muted); }
  #steps { overflow: auto; padding: 24px; }
  .event-card { background: #fff; border: 1px solid var(--line); border-left: 4px solid #f59e0b; border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; max-width: 760px; }
  .event-card h2 { margin: 0; font-size: 15px; }
  .event-card small { color: var(--muted); }
  .step { background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--radius); padding: 10px 14px; margin: 0 0 10px 0; max-width: 760px; }
  .step.branch { margin-left: 28px; border-left-color: #8b5cf6; max-width: 732px; }
  .step .n { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  .step h3 { margin: 2px 0 6px; font-size: 14px; display: flex; gap: 8px; align-items: baseline; }
  .step h3 span { color: var(--muted); font-weight: 400; font-size: 12px; }
  .step ul { margin: 0; padding-left: 16px; color: #3b4252; }
  .step ul li code { background: #f4f6fa; padding: 0 4px; border-radius: 3px; }
  .step .acts { margin-top: 8px; display: flex; gap: 6px; }
  .branch-label { margin: 2px 0 6px 28px; color: #8b5cf6; font-size: 12px; font-weight: 600; }
  .menu { position: absolute; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 6px 24px rgba(0,0,0,.14); padding: 6px; z-index: 50; min-width: 260px; max-height: 60vh; overflow: auto; }
  .menu input { margin-bottom: 6px; }
  .menu div.item { padding: 6px 8px; border-radius: 4px; cursor: default; }
  .menu div.item:hover { background: var(--accent-soft); }
  .menu div.item small { color: var(--muted); display: block; }

  /* ---- Data ---- */
  #data { grid-template-columns: 240px 1fr; }
  .types { padding: 0 6px; }
  .types div.row { padding: 6px 8px; border-radius: 4px; cursor: default; display: flex; justify-content: space-between; }
  .types div.row:hover { background: #f4f6fa; }
  .types div.row[aria-selected=true] { background: var(--accent-soft); color: var(--accent); }
  .types div.row small { color: var(--muted); }
  #datamain { overflow: auto; padding: 20px 24px; }
  #datamain h2 { margin: 0 0 10px; font-size: 16px; }
  table { border-collapse: collapse; background: #fff; border: 1px solid var(--line); width: 100%; max-width: 1100px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: #f8f9fb; font-weight: 600; font-size: 12px; }
  td input, td select { padding: 2px 4px; }
  td.cell { cursor: text; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.cell:hover { background: #f8f9fb; }
  .bar { display: flex; gap: 8px; align-items: center; margin: 14px 0 8px; }
  .bar .note { color: var(--muted); font-size: 12px; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #1b1f27; color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 100; max-width: 70vw; }
  #toast.show { opacity: 1; }
</style>

<header>

  <nav role="tablist">

    <button role="tab" data-tab="workflow">Workflow</button>
    <button role="tab" data-tab="data">Data</button>
  </nav>
  <label id="pagepick-l">Page <select id="pagepick"></select></label>
  <label id="width-l">Width <select id="widthpick"><option value="100%">Fill</option><option value="1280">1280</option><option value="1024">1024</option><option value="768">768</option><option value="390">390 (phone)</option></select></label>
  <label><input type="checkbox" id="previewmode"> Use the app</label>

<script src="/preview.js"></script>
<script type="module">
import { hasSpec, specs, drawnPorts, portProjectFromStore, portContextFor } from './specs.js';

const $ = (id) => document.getElementById(id);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else if (v !== undefined && v !== null && v !== false) el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
};
let toastTimer;
const toast = (msg) => { $('toast').textContent = msg; $('toast').classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.remove('show'), 3200); };
const status = (msg, bad = false) => { $('status').textContent = msg; $('status').classList.toggle('bad', bad); };
const uuid = () => crypto.randomUUID();

/* ================= the project: files in memory, the kit's store over them, saved by serve.mjs ================= */
const opened = await (await fetch('/api/project')).json();
$('projname').textContent = opened.name;
document.title = `${opened.name} — Open Bubble`;
let files = NodegxPreview.memoryFiles(opened.files);
let store = new NodegxPreview.V2ProjectStore(files);
let persisted = { ...opened.files };
const undoStack = [];

async function persist() {
  const now = files.entries();
  const changed = {};
  for (const [p, t] of Object.entries(now)) if (persisted[p] !== t) changed[p] = t;
  const removed = Object.keys(persisted).filter((p) => !(p in now));
  if (!Object.keys(changed).length && !removed.length) return;
  const r = await fetch('/api/save', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ files: changed, removed }) });
  const j = await r.json();
  if (!r.ok) { toast(`Not saved: ${j.error}`); return; }
  persisted = { ...now };
  status(`Saved ${j.written.length + j.removed.length} file(s) · ${new Date().toLocaleTimeString()}`);
}
const snapshot = () => { undoStack.push(files.entries()); if (undoStack.length > 60) undoStack.shift(); };
async function undo() {
  const snap = undoStack.pop();
  if (!snap) return toast('Nothing to undo');
  files = NodegxPreview.memoryFiles(snap);
  store = new NodegxPreview.V2ProjectStore(files);
  await persist();
  readGraph();
  rebuild();
  renderAll();
}
$('undo').onclick = undo;

/* ================= the eight edits, with the reference's semantics (editor-suite/edits.ts) ================= */
function applyEdit(filesIn, edit) {
  const out = JSON.parse(JSON.stringify(filesIn));
  const nodes = out.nodes.nodes;
  const byId = new Map(nodes.map((n) => [n.id, n]));
  const must = (id, what) => { const n = byId.get(id); if (!n) throw new Error(`${what}: node "${id}" does not exist.`); return n; };
  const attach = (child, parentId, index) => {
    const parent = must(parentId, 'attach');
    if (!parent.children) parent.children = [];
    if (!parent.children.includes(child.id)) {
      const at = index !== undefined ? Math.max(0, Math.min(index, parent.children.length)) : parent.children.length;
      parent.children.splice(at, 0, child.id);
    }
    child.parent = parentId;
  };
  switch (edit.edit) {
    case 'add_node': {
      const id = edit.id ?? uuid();
      if (byId.has(id)) throw new Error(`add_node: "${id}" exists`);
      const node = { id, type: edit.type };
      if (edit.label !== undefined) node.label = edit.label;
      if (edit.x !== undefined) node.x = edit.x;
      if (edit.y !== undefined) node.y = edit.y;
      if (edit.parameters) node.parameters = { ...edit.parameters };
      if (edit.parent !== undefined) attach(node, edit.parent, edit.index);
      nodes.push(node);
      return { files: out, id };
    }
    case 'remove_node': {
      must(edit.id, 'remove_node');
      const doomed = new Set([edit.id]);
      let grew = true;
      while (grew) { grew = false; for (const n of nodes) if (n.parent !== undefined && doomed.has(n.parent) && !doomed.has(n.id)) { doomed.add(n.id); grew = true; } }
      out.nodes.nodes = nodes.filter((n) => !doomed.has(n.id));
      for (const n of out.nodes.nodes) if (n.children) { n.children = n.children.filter((c) => !doomed.has(c)); if (!n.children.length) delete n.children; }
      out.connections.connections = out.connections.connections.filter((c) => !doomed.has(c.fromId) && !doomed.has(c.toId));
      if (out.nodes.visualRoots) { out.nodes.visualRoots = out.nodes.visualRoots.filter((id) => !doomed.has(id)); if (!out.nodes.visualRoots.length) delete out.nodes.visualRoots; }
      return { files: out };
    }
    case 'connect': {
      const c = { fromId: edit.from.node, fromProperty: edit.from.port, toId: edit.to.node, toProperty: edit.to.port };
      must(c.fromId, 'connect'); must(c.toId, 'connect');
      if (out.connections.connections.some((x) => sameWire(x, c))) throw new Error('connect: that wire exists');
      out.connections.connections.push(c);
      return { files: out };
    }
    case 'disconnect': {
      const c = { fromId: edit.from.node, fromProperty: edit.from.port, toId: edit.to.node, toProperty: edit.to.port };
      out.connections.connections = out.connections.connections.filter((x) => !sameWire(x, c));
      return { files: out };
    }
    case 'set_parameter': {
      const node = must(edit.id, 'set_parameter');
      if (edit.value === undefined) { if (node.parameters) delete node.parameters[edit.name]; }
      else node.parameters = { ...(node.parameters ?? {}), [edit.name]: edit.value };
      return { files: out };
    }
    case 'move': { const node = must(edit.id, 'move'); node.x = edit.x; node.y = edit.y; return { files: out }; }
    case 'rename': { const node = must(edit.id, 'rename'); node.label = edit.label; return { files: out }; }
    case 'add_child': {
      const node = must(edit.id, 'add_child'); must(edit.parent, 'add_child');
      if (edit.parent === edit.id) throw new Error('add_child: own parent');
      for (let cur = byId.get(edit.parent); cur; cur = cur.parent !== undefined ? byId.get(cur.parent) : undefined) if (cur.id === edit.id) throw new Error('add_child: inside own subtree');
      if (node.parent !== undefined) { const old = byId.get(node.parent); if (old?.children) { old.children = old.children.filter((c) => c !== node.id); if (!old.children.length) delete old.children; } }
      attach(node, edit.parent, edit.index);
      return { files: out };
    }
  }
  throw new Error('unknown edit');
}
const sameWire = (a, b) => a.fromId === b.fromId && a.fromProperty === b.fromProperty && a.toId === b.toId && a.toProperty === b.toProperty;

/** One gesture = one write: every edit applied to the component's files, then written once with ifRevision. */
function edits(componentKey, list, { rebuildApp = true } = {}) {
  snapshot();
  const c = store.readComponent(componentKey);
  let cur = c.files, ids = [];
  for (const e of list) { const r = applyEdit(cur, e); cur = r.files; if (r.id) ids.push(r.id); }
  try { store.writeComponent(componentKey, cur, { ifRevision: c.revision }); }
  catch (err) { undoStack.pop(); toast(err.message); throw err; }
  persist();
  if (componentKey === pageKey) readGraph();
  if (rebuildApp) rebuild();
  // an edit that changes which fields or steps exist redraws the panel; typing into a field does not (it would lose the caret)
  if (list.some((e) => !['set_parameter', 'rename', 'move'].includes(e.edit) || (e.edit === 'set_parameter' && e.name === 'collectionName'))) setTimeout(() => { if (tab === 'workflow') renderWorkflow(); else if (tab === 'design') { renderTree(); renderProps(); } }, 0);
  return ids;
}

/* ================= the real app ================= */
const preview = await NodegxPreview.mountPreview($('app'), { runtimeBase: '/runtime/' });
window.__ob = { preview, get store() { return store; }, get files() { return files; } };
let lib, libIndex = new Map();
let lastShow = null;
let rebuildTimer;
let rebuilding = false;
function rebuild(delay = 120) {
  clearTimeout(rebuildTimer);
  rebuildTimer = setTimeout(async () => {
    rebuilding = true;
    status('Rebuilding the app…');
    const s = await preview.update(files.entries());
    lastShow = s; window.__ob.shows = (window.__ob.shows || 0) + 1;
    rebuilding = false;
    showProblems(s);
    if (s.status === 'ok') {
      lib = preview.nodeLibrary; libIndex = new Map((lib?.nodetypes || []).map((t) => [t.name, t]));
      status(`App on screen · ${Math.round(s.exportMs)} ms export, ${Math.round(s.frameMs)} ms draw${s.warnings?.length ? ` · ${s.warnings.length} warning(s)` : ''}`);
      await showPage(pageKey);
      hookFrame();
      mapElements();
      draw();
    } else {
      const first = s.report?.diagnostics?.find((d) => d.severity === 'error');
      status(`The app is not shown: ${first ? first.message.slice(0, 160) : s.message || s.status}`, true);
    }
  }, delay);
}

/**
 * Why the app is not on screen, as Bubble's issue checker would list it: every error the preview's validator found,
 * with the component and node, and a fix where the editor can make one — a node with no `type` (the preview refuses
 * the whole project for it) is removed through the store.
 */
function showProblems(s) {

  function outside(ev) { if (!menu.contains(ev.target)) closeMenu(); else document.addEventListener('mousedown', outside, { once: true }); }
}
const closeMenu = () => { for (const m of document.querySelectorAll('.menu')) m.remove(); };
function addAction(type, from) {

$('newevent').onclick = (e) => {

/* ================= Data: types and fields (the project file), rows (the backend) ================= */
let selType = null;
const projectJson = () => store.readProjectFile();
function writeProject(pj) {
  snapshot();
  files.write('nodegx.project.json', JSON.stringify(pj, null, 2));
  persist(); rebuild();
}
const collections = () => projectJson()?.metadata?.dbCollections || [];
const schemaTables = () => { try { return JSON.parse(files.read('backend/schema.json') || '[]').filter((s) => s.action === 'createTable'); } catch { return []; } };
function renderTypes() {
  const box = $('types'); box.innerHTML = '';
  const names = new Set();
  for (const c of collections()) { names.add(c.name); box.append(h('div', { class: 'row', 'aria-selected': selType === c.name, onclick: () => { selType = c.name; renderData(); } }, c.name, h('small', {}, `${c.columns?.length ?? 0} fields`))); }
  for (const t of schemaTables()) if (!names.has(t.table)) box.append(h('div', { class: 'row', 'aria-selected': selType === t.table, onclick: () => { selType = t.table; renderData(); } }, t.table, h('small', {}, 'schema.json')));
  if (!box.children.length) box.append(h('div', { class: 'hint' }, 'No data types yet.'));
}
$('newtype').onclick = () => {
  const name = prompt('Name of the new data type (a collection)');
  if (!name) return;
  const pj = projectJson(); pj.metadata ??= {}; pj.metadata.dbCollections ??= [];
  if (pj.metadata.dbCollections.some((c) => c.name === name)) return toast('That type exists');
  pj.metadata.dbCollections.push({ name, columns: [] });
  writeProject(pj); selType = name; renderData();
};
const FIELD_TYPES = ['String', 'Number', 'Boolean', 'Date', 'Pointer', 'Array', 'Object', 'File', 'GeoPoint'];
async function renderData() {
  renderTypes();
  const main = $('datamain'); main.innerHTML = '';
  if (!selType) { main.append(h('div', { class: 'empty' }, 'Pick a data type.')); return; }
  // one parse of the project file for the whole render: the fields below mutate `coll` and write `pj` back
  const pj = projectJson();
  const coll = (pj?.metadata?.dbCollections || []).find((c) => c.name === selType);
  const fromSchema = schemaTables().find((t) => t.table === selType);
  const cols = coll?.columns || fromSchema?.columns || [];
  main.append(h('h2', {}, selType));
  if (fromSchema && !coll) main.append(h('div', { class: 'bar' }, h('span', { class: 'note' }, 'Defined in backend/schema.json (read-only here).')));
  // fields
  const ft = h('table', {}, h('tr', {}, h('th', {}, 'Field'), h('th', {}, 'Type'), h('th', {}, 'Of type'), h('th', {})));
  cols.forEach((col, i) => ft.append(h('tr', {},
    h('td', {}, coll ? h('input', { type: 'text', value: col.name, onchange: (e) => { col.name = e.target.value; writeProject(pj); renderData(); } }) : col.name),
    h('td', {}, coll ? h('select', { onchange: (e) => { col.type = e.target.value; writeProject(pj); renderData(); } }, ...FIELD_TYPES.map((t) => h('option', { value: t, selected: col.type === t }, t))) : col.type),
    h('td', {}, col.type === 'Pointer' ? (coll ? h('input', { type: 'text', value: col.targetClass || '', placeholder: 'target type', onchange: (e) => { col.targetClass = e.target.value; writeProject(pj); } }) : col.targetClass) : ''),
    h('td', {}, coll ? h('button', { class: 'tiny danger', onclick: () => { coll.columns.splice(i, 1); writeProject(pj); renderData(); } }, '×') : ''))));
  main.append(ft);
  if (coll) main.append(h('div', { class: 'bar' }, h('button', { onclick: () => { const name = prompt('Field name'); if (!name) return; coll.columns ??= []; coll.columns.push({ name, type: 'String' }); writeProject(pj); renderData(); } }, '+ New field'),
    h('button', { class: 'danger', onclick: () => { if (!confirm(`Remove the type ${selType} from the project? (Rows on the backend are kept.)`)) return; pj.metadata.dbCollections = pj.metadata.dbCollections.filter((c) => c.name !== selType); writeProject(pj); selType = null; renderData(); } }, 'Remove type')));
  // rows
  main.append(h('h2', { style: 'margin-top:22px' }, 'App data'));
  const rowsBox = h('div', {}, h('div', { class: 'note' }, 'Loading…'));
  main.append(rowsBox);
  await renderRows(rowsBox, cols);
}
async function api(path, init) {
  const r = await fetch('/api/backend' + path, { headers: { 'content-type': 'application/json' }, ...init });
  let body = null; try { body = await r.json(); } catch { /* empty */ }
  if (!r.ok) throw new Error(body?.error || `${r.status} ${r.statusText}`);
  return body;
}
async function renderRows(box, cols) {
  box.innerHTML = '';
  const backend = opened.backend;
  if (!backend?.endpoint) { box.append(h('div', { class: 'note' }, 'This project is not bound to a backend, so there are no rows to show. Provision one with the nodegx server (provision_backend).')); return; }
  let rows;
  try { rows = (await api(`/classes/${encodeURIComponent(selType)}?limit=100`)).results || []; }
  catch (err) { box.append(h('div', { class: 'note' }, `The backend at ${backend.endpoint} did not answer for ${selType}: ${err.message}`)); return; }
  const names = cols.map((c) => c.name);
  const t = h('table', {}, h('tr', {}, h('th', {}, 'id'), ...names.map((n) => h('th', {}, n)), h('th', {}, 'created'), h('th', {})));
  for (const row of rows) {
    const tr = h('tr', {}, h('td', {}, h('code', {}, String(row.objectId || row.id || '').slice(0, 10))));
    for (const n of names) {
      const v = row[n];
      const td = h('td', { class: 'cell', onclick: () => editCell(td, row, n, v) }, v === undefined || v === null ? '' : typeof v === 'object' ? JSON.stringify(v) : String(v));
      tr.append(td);
    }
    tr.append(h('td', {}, (row.createdAt || '').slice(0, 16)), h('td', {}, h('button', { class: 'tiny danger', onclick: async () => { if (!confirm('Delete this row?')) return; try { await api(`/classes/${encodeURIComponent(selType)}/${row.objectId}`, { method: 'DELETE' }); renderData(); } catch (e) { toast(e.message); } } }, '×')));
    t.append(tr);
  }
  box.append(h('div', { class: 'bar' }, h('button', { class: 'primary', onclick: async () => { try { await api(`/classes/${encodeURIComponent(selType)}`, { method: 'POST', body: JSON.stringify({}) }); renderData(); } catch (e) { toast(e.message); } } }, '+ New entry'), h('span', { class: 'note' }, `${rows.length} row(s) on ${backend.endpoint}`)), t);
}
function editCell(td, row, field, value) {
  if (td.querySelector('input')) return;
  const col = (collections().find((c) => c.name === selType)?.columns || []).find((c) => c.name === field);
  const inp = h('input', { type: 'text', value: value === undefined || value === null ? '' : typeof value === 'object' ? JSON.stringify(value) : String(value) });
  td.textContent = ''; td.append(inp); inp.focus(); inp.select();
  let done = false;
  const commit = async () => {
    if (done) return; done = true;
    let v = inp.value;
    if (col?.type === 'Number') v = v === '' ? null : Number(v);
    else if (col?.type === 'Boolean') v = /^(true|yes|1)$/i.test(v);
    else if (['Array', 'Object', 'Pointer', 'GeoPoint'].includes(col?.type)) { try { v = JSON.parse(v); } catch { /* keep text */ } }
    try { await api(`/classes/${encodeURIComponent(selType)}/${row.objectId}`, { method: 'PUT', body: JSON.stringify({ [field]: v }) }); td.textContent = inp.value; }
    catch (e) { toast(e.message); td.textContent = value ?? ''; }

  inp.onblur = commit; inp.onkeydown = (e) => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') { done = true; td.textContent = value ?? ''; } };
}
