<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="../" />
    <title>Heroine lab</title>
    <style>html,body{margin:0;height:100%;background:#111;overflow:hidden}#view{position:fixed;inset:0}</style>
    <script type="importmap">
      { "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three-addons/", "@pixiv/three-vrm": "/vendor/three-vrm/three-vrm.module.js" } }
    </script>
  </head>
  <body>
    <div id="view"></div>
    <script type="module">
      import * as THREE from 'three';
      import { makeView } from './src/look.mjs';
      import { loadHeroine, Heroine } from './src/hero.mjs';
      const view = makeView(document.getElementById('view'));
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x2a2340);
      view.setScene(scene);
      scene.add(new THREE.HemisphereLight(0xcfd8ff, 0x403050, 0.9));
      const sun = new THREE.DirectionalLight(0xffeedd, 1.4);
      sun.position.set(2, 4, 3);
      scene.add(sun);
      const floor = new THREE.Mesh(new THREE.CircleGeometry(4, 40).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x55506a }));
      scene.add(floor);
      const body = await loadHeroine({ renderer: view.renderer });
      const heroes = [];
      const looks = [
        { hat: 'witch', cape: 'none', dress: 'violet', hair: 'chestnut' },
        { hat: 'tiara', cape: 'starlight', dress: 'rose', hair: 'pink' },
        { hat: 'bow', cape: 'rose', dress: 'mint', hair: 'gold' }
      ];
      for (let i = 0; i < 3; i++) {
        const h = new Heroine(body);
        h.group.position.x = (i - 1) * 1.1;
        scene.add(h.group);
        h.wear(looks[i]);
        heroes.push(h);
      }
      view.camera.position.set(0, 1.3, 4.2);
      view.camera.lookAt(0, 0.95, 0);
      const clock = new THREE.Clock();
      view.renderer.setAnimationLoop(() => {
        const dt = Math.min(clock.getDelta(), 0.1);
        for (const h of heroes) h.update(dt);
        view.render();
      });
      window.__lab = { heroes, view, THREE, ready: true };
    </script>
  </body>
</html>
