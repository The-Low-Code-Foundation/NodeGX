<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <title>The Dig</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      { "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three-addons/" } }
    </script>
  </head>
  <body>
    <div id="view"></div>
    <div id="touch"></div>
    <div id="hud">
      <div id="crosshair"></div>
      <div id="hitmarker"></div>
      <div id="crack"></div>
      <div id="top">
        <div id="vitals"><div id="health"><div id="healthfill"></div></div><div id="depth"></div></div>
        <div id="hotbar"></div>
        <button id="menuBtn" aria-label="Menu">☰</button>
      </div>
      <div id="warn"></div>
      <div id="toasts"></div>
      <div id="prompt"></div>
      <div id="stick"><div id="knob"></div></div>
      <div id="buttons">
        <button id="btnUse" hidden>Use</button>
        <button id="btnAim" hidden>Aim</button>
        <button id="btnFire" hidden>Fire</button>
        <button id="btnJump" aria-label="Jump">▲</button>
      </div>
      <div id="flash"></div>
      <div id="hurt"></div>
      <div id="scope"></div>
    </div>
    <div id="panel" hidden><div id="card"></div></div>
    <div id="start">
      <div class="start-card">
        <h1>The Dig</h1>
        <p id="startNote">Loading the deep…</p>
        <button id="startBtn" disabled>Start digging</button>
        <p class="small" id="startHelp"></p>
      </div>
    </div>
    <div id="rotate"><div>Turn your phone sideways to dig.</div></div>
    <script type="module" src="src/game.mjs"></script>
  </body>
</html>
