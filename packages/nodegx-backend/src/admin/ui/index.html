<!--
  The NodeGX backend manager (BAK-005, rebuilt as an app in BMG-001).

  One self-contained document: the token sheet and stylesheet are inlined into
  the empty <style> block, the app bundle (src/admin/app, built by
  scripts/build-admin-app.js) into the empty <script> block. No external
  origin — see AdminDashboardRoutes' module doc for why the CSP can forbid one.

  The three substitution markers this file carries must each appear EXACTLY
  where they are meant to and nowhere else (the injector counts them and
  refuses otherwise), so do not quote them in prose.

  Rules the app holds itself to:
    - Backend data reaches the DOM as text. Preact escapes; the source gate
      forbids dangerouslySetInnerHTML, so a hostile string in a row is inert
      even before the CSP gets involved.
    - Every mutation is issued by an explicit action and reports its outcome.
      Nothing fails quietly (RUN-004): a refused request surfaces the server's
      own message verbatim, including the read-only tier's refusal.
    - A section whose backing subsystem is absent is not rendered at all; it
      never renders and then errors.
-->

<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<meta name="color-scheme" content="dark light" />
