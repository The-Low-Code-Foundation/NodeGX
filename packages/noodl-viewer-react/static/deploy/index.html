<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <title>{{#title#}}</title>
{{#customHeadCode#}}

    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: white;
      }

      .body-scroll {
        overflow: hidden auto;
      }

      img {
        -webkit-user-drag: none;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      }

      #root {
        display: flex;
        width: 100%;
        height: 100%;
        /* NDA-008: defensive, and honestly labelled — this element is NOT the one
           that caused the reported scroll jump. Measured live: with the app root
           inside it set to `clip`, focusing an input 2018px below the fold moved
           this element 0px, because its only child is `height: 100%` so its content
           never exceeds it. The active fix is in viewer.jsx.

           Kept anyway because it is the same trap one layout change away: `hidden`
           around taller content is a scroll container the *browser* can scroll (any
           real DOM focus does) and the user cannot scroll back, since hidden only
           removes the scrollbars. `clip` creates no scroll container at all.

           Both declared: browsers without `clip` (Safari < 16) keep exactly today's
           behaviour rather than falling back to `visible` and letting content escape.
           Dropping `hidden` also drops the block formatting context it implied;
           `position: fixed` below already provides the positional containment. */
        overflow: hidden;
        overflow: clip;
        position: fixed;
      }

      .body-scroll > #root {
        width: 100%;
        height: auto;
        min-height: 100vh;
        flex-direction: column;
        overflow: initial;
        position: initial;
      }
    </style>
  </head>
  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>

    <div id="root"></div>

    <script src="%baseUrl%react.production.min.js"></script>
    <script src="%baseUrl%react-dom.production.min.js"></script>

    <%modules_dependencies%>
    <%index_js%>

    <%modules_main%>

    <script src="%baseUrl%noodl.deploy.js"></script>
    <script type="application/javascript">
      // DEP-001: nodegx-config.json beside this page may re-point the backend. The request starts
      // now, not at DOMContentLoaded, so it overlaps the parse. It never rejects: no file (404) or
      // an unreadable one means the address this app was deployed with.
      var noodlDeployConfig = window.Noodl._viewerReact.loadDeployConfig("%baseUrl%nodegx-config.json");
      document.addEventListener("DOMContentLoaded", function () {
        const root = document.getElementById("root");
        const viewer = window.Noodl._viewerReact;
        noodlDeployConfig.then(function (config) {
          try {
            viewer.applyDeployConfig(window.projectData, config);
          } catch (error) {
            console.warn("NodeGX: nodegx-config.json was not applied.", error);
          }
          viewer.renderDeployed(root, __noodl_modules, window.projectData);
        });
      });
    </script>
  </body>
</html>
